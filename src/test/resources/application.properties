# Test properties: use H2 in-memory database to avoid touching MySQL during tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create and drop schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable mail during tests
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

# Set default-from used by EmailService
app.mail.default-from=no-reply@beconsulting.tn

# JWT settings for tests - secret must be long enough for HS256 (>= 32 bytes)
jwt.secret=beyondsalesTestSecretKeyThatIsLongEnoughForHS256-2025-0123456789
jwt.expiration=3600000
jwt.refresh.expiration=86400000

# Avoid executing any SQL scripts from main resources
spring.sql.init.mode=never

# Reduce logging noise during tests
logging.level.org.hibernate=ERROR
logging.level.org.springframework=ERROR
