spring.application.name=BeyondSales
# ===== Datasource =====
spring.datasource.url=jdbc:mysql://localhost:3306/bsales?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=bec
spring.datasource.password=bec
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DISABLE FULL SCHEMA VALIDATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=true

# Disable validation
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.defer-datasource-initialization=true

# Disable Hibernate schema validation
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.ddl-auto=update

# Force update without validation
spring.sql.init.mode=always

# ===== JPA / Hibernate =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== Server =====
server.port=8080

# ===== JWT Settings =====
jwt.secret=beyondsalesSecretKeyForJwtMustBeLongEnough123!
jwt.expiration=86400000

# ===== Logging =====
logging.level.org.springframework=INFO
logging.level.com.beyondsales=DEBUG

spring.mail.host=ssl0.ovh.net
spring.mail.port=587
spring.mail.username=bsales@beconsulting.tn
spring.mail.password=beconsulting
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=true
app.mail.default-from=no-reply@beconsulting.tn
